# Variante si le VPS a déjà nginx (au lieu du service caddy du compose).
# Lancer seulement l'app : docker compose up -d --build app, avec ports: ["127.0.0.1:3001:3001"]
# puis : certbot --nginx -d jeu.exemple.com
server {
    listen 80;
    server_name jeu.exemple.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
