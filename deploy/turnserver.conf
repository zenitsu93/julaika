# coturn pour la visio julaika. Le secret est passé en ligne de commande (docker-compose.yml),
# le serveur de jeu en dérive des identifiants valables 12 h (voir apps/server/src/ice.ts).
#
# Ports à ouvrir sur le VPS :
#   sudo ufw allow 3478/tcp && sudo ufw allow 3478/udp && sudo ufw allow 49160:49200/udp
# Puis dans ~/julaika/.env :
#   COMPOSE_PROFILES=turn
#   TURN_SECRET=<openssl rand -hex 32>
#   TURN_URLS=turn:julaika.2nbdigital.com:3478?transport=udp,turn:julaika.2nbdigital.com:3478?transport=tcp

listening-port=3478
fingerprint
use-auth-secret
realm=julaika.2nbdigital.com
min-port=49160
max-port=49200
# 8 joueurs par salon en maillage : quelques dizaines de relais suffisent.
total-quota=100
stale-nonce=600
no-cli
no-tls
no-dtls
no-multicast-peers
# Un joueur ouvre au plus deux relais (UDP et TCP) par personne de la visio : 7 × 2.
user-quota=16
# Octets par seconde et par relais (≈ 4 Mbit/s) : assez pour la vidéo, trop peu pour un relais gratuit.
max-bps=500000
# WebRTC ne relaie que de l'UDP : pas de relais TCP vers l'extérieur (RFC 6062).
no-tcp-relay
# Interdit de relayer vers le VPS lui-même et vers les réseaux non publics (protection SSRF) :
# coturn tourne en réseau hôte, un relais vers ces adresses atteindrait des services cachés par ufw.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# IP publique du VPS (julaika.2nbdigital.com) : à changer si le serveur change.
denied-peer-ip=15.235.241.90
denied-peer-ip=::-::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
